name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ./gradlew assembleDebug --no-daemon 2>&1 | tee build_log.txt; then
            echo "BUILD_OK"
          else
            echo "BUILD_FAILED，关键错误行："
            grep -nE 'e: |error:|FAILURE|What went wrong|FAILED|Exception|Unresolved|not applicable' build_log.txt | head -50 | while IFS= read -r ln; do
              safe=$(printf '%s' "$ln" | sed 's/%/%25/g; s/\r//g')
              echo "::error::$safe"
            done
            exit 1
          fi

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daqin-bandit-helper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传构建日志（诊断）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore
