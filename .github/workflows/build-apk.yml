name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Debug APK 并回写日志
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > build_log.txt 2>&1 || true
          echo "=== BUILD_DONE ===" >> build_log.txt
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['TOKEN']; sha = os.environ['SHA']; repo = os.environ['REPO']
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                 "Content-Type": "application/json"}
          try:
              txt = open("build_log.txt", encoding="utf-8", errors="replace").read()
          except Exception as e:
              txt = f"no build_log.txt: {e}"
          tail = txt[-40000:]
          body = "**BUILD LOG TAIL**\n```\n" + tail + "\n```"
          # 1) 尝试提交评论
          cmsg = ""
          url = f"https://api.github.com/repos/{repo}/commits/{sha}/comments"
          try:
              req = urllib.request.Request(url, data=json.dumps({"body": body}).encode("utf-8"), headers=hdr, method="POST")
              r = urllib.request.urlopen(req, timeout=30)
              cmsg = f"comment_posted:{r.status}"
          except urllib.error.HTTPError as e:
              cmsg = f"comment_failed:{e.code}:{e.read().decode(errors='replace')[:300]}"
          except Exception as e:
              cmsg = f"comment_exc:{e}"
          print("COMMENT_RESULT", cmsg)
          # 2) 尝试 Checks PATCH（补齐必填字段）
          pmsg = ""
          try:
              data = json.load(urllib.request.urlopen(urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=5", headers=hdr), timeout=30))
              cr = data.get("check_runs", [{}])[0]
              crid = cr.get("id")
              if crid:
                  patch = json.dumps({
                      "name": cr.get("name", "build"),
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": cr.get("conclusion") or "neutral",
                      "output": {"title": "build log", "summary": tail}
                  }).encode("utf-8")
                  preq = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/check-runs/{crid}",
                      data=patch, headers={**hdr}, method="PATCH")
                  pr = urllib.request.urlopen(preq, timeout=30)
                  pmsg = f"check_patched:{pr.status}"
              else:
                  pmsg = "no_crid"
          except Exception as e:
              pmsg = f"check_exc:{e}"
          print("CHECK_RESULT", pmsg)
          PY
