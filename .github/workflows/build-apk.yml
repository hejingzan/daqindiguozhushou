name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Debug APK（捕获日志，不阻断）
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build_log.txt || true

      - name: 把构建日志写入 check-run 摘要
        if: always()
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['TOKEN']; sha = os.environ['SHA']; repo = os.environ['REPO']
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          # 读取并截断日志
          try:
              txt = open("build_log.txt", encoding="utf-8", errors="replace").read()[-60000:]
          except Exception as e:
              txt = f"no build_log.txt: {e}"
          summary = json.dumps(txt)
          # 取 check run id
          url = f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=5"
          req = urllib.request.Request(url, headers=hdr)
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
              crid = data.get("check_runs", [{}])[0].get("id")
          except Exception as e:
              print("get check-run failed:", e); crid = None
          if crid:
              patch = json.dumps({"output": {"title": "build log", "summary": txt}}).encode("utf-8")
              preq = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/check-runs/{crid}",
                  data=patch, headers={**hdr, "Content-Type": "application/json"}, method="PATCH")
              try:
                  urllib.request.urlopen(preq, timeout=30)
                  print("check-run summary updated, crid=", crid)
              except Exception as e:
                  print("patch failed:", e)
          else:
              print("no check run id")
          PY

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daqin-bandit-helper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
