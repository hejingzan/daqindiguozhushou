name: 构建 APK

# 触发方式：
# 1) push 到 main/master 自动构建；
# 2) 仓库 Actions 页面手动 "Run workflow"。
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库未提交 gradlew / gradle-wrapper.jar，故用官方 action 自动下载 Gradle 8.5 并构建
      - name: 构建 Debug APK（自动下载 Gradle 与依赖）
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: daqin-bandit-helper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
