name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Debug APK 并回写日志到提交评论
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > build_log.txt 2>&1 || true
          echo "=== BUILD_DONE ===" >> build_log.txt
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['TOKEN']; sha = os.environ['SHA']; repo = os.environ['REPO']
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                 "Content-Type": "application/json"}
          try:
              txt = open("build_log.txt", encoding="utf-8", errors="replace").read()
          except Exception as e:
              txt = f"no build_log.txt: {e}"
          # 截断到 50000 字符，避免超出评论上限
          if len(txt) > 50000:
              txt = "...(前段省略)...\n" + txt[-50000:]
          body = "**BUILD LOG**\n```\n" + txt + "\n```"
          url = f"https://api.github.com/repos/{repo}/commits/{sha}/comments"
          req = urllib.request.Request(url, data=json.dumps({"body": body}).encode("utf-8"), headers=hdr, method="POST")
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print("comment posted, status", resp.status)
          except urllib.error.HTTPError as e:
              print("post failed", e.code, e.read().decode(errors="replace")[:500])
          PY

      - name: 上传 APK 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daqin-bandit-helper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
