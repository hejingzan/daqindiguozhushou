name: 构建 APK

# 触发方式：
# 1) push 到 main/master 自动构建；
# 2) 仓库 Actions 页面手动 "Run workflow"。
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 需要 contents 写权限，以便把构建出的 APK 通过 api.github.com 写回仓库
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库未提交 gradlew / gradle-wrapper.jar，故用官方 action 自动下载 Gradle 8.5 并构建
      - name: 构建 Debug APK（自动下载 Gradle 与依赖）
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: 上传 APK 产物（GitHub 界面可见）
        uses: actions/upload-artifact@v4
        with:
          name: daqin-bandit-helper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 用 git push 把 APK 提交回仓库（绕过 Azure 产物下载被代理拦截的问题）
      - name: 提交 APK 到仓库（git push）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          mkdir -p apk_release
          cp "$APK" apk_release/app-debug-v4.0.apk
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git add -f apk_release/app-debug-v4.0.apk
          git commit -m "ci: add debug APK [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main
